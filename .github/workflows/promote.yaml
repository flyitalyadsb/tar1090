name: promote canary to stable

# flyitalyadsb: the nginx pods of cell B run tar1090 `canary`, cell A `stable` (argocd-image-updater
# in nesso-infra). Once a night this moves `stable` to the canary, if cell B has
# run it long enough and stayed in line with cell A. The rules are in
# .github/scripts/promote.py; the design in nesso-infra
# docs/FLYITALYADSB-TWO-CELLS.md, "Automatic release of readsb and tar1090".
on:
  schedule:
    # At night, before the morning traffic (a promotion restarts cell A's nginx,
    # with no gap). GitHub may run it late; any hour works.
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      bootstrap_digest:
        description: "Once: point stable at this digest (sha256:...), what cell A already runs (canary too if missing)"
        required: false
        default: ""
      dry_run:
        description: "Decide and report, don't move any tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the gate
        run: python3 .github/scripts/test_promote.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide and promote
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT_FIELD: tar1090_commit
          STARTED_FIELD: tar1090_started
          SOAK_HOURS: "20"
          MIN_RATIO: "0.85"
          BOOTSTRAP_DIGEST: ${{ inputs.bootstrap_digest }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/promote.py
