name: sync upstream

# flyitalyadsb: merge wiedehopf/tar1090 master into this branch once a day, move
# flyitalyadsb/tar1090-db.commit to wiedehopf/tar1090-db master, and build when
# either made a commit (that build becomes the canary for cell B).
# This branch carries only flyitalyadsb/ and .github/ on top of upstream, so the
# merge is clean unless upstream adds files with those names.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # A push made with GITHUB_TOKEN starts no workflow: start the build explicitly.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flyitalyadsb
          fetch-depth: 0
      - name: Merge wiedehopf/tar1090 master
        id: merge
        run: |
          git remote add upstream https://github.com/wiedehopf/tar1090.git
          git fetch -q upstream master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "::error::Merge conflict with upstream master, needs a manual merge"
            exit 1
          fi
      # tar1090-db replaces its last commit when the data changes, so the pinned
      # one can stop being downloadable: follow it every day.
      - name: Follow wiedehopf/tar1090-db master
        run: |
          db=$(git ls-remote https://github.com/wiedehopf/tar1090-db.git refs/heads/master | cut -f1)
          if [ -z "$db" ]; then
            echo "::error::Could not read wiedehopf/tar1090-db master"
            exit 1
          fi
          if [ "$db" != "$(cat flyitalyadsb/tar1090-db.commit)" ]; then
            echo "$db" > flyitalyadsb/tar1090-db.commit
            git commit -q -m "flyitalyadsb: tar1090-db ${db:0:7}" flyitalyadsb/tar1090-db.commit
          fi
      - name: Push
        id: push
        env:
          BEFORE: ${{ steps.merge.outputs.before }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push origin flyitalyadsb
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the new commit
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo: with a remote named "upstream" in this checkout, gh picks it
        # (wiedehopf/tar1090) as the repository and the call 404s. It failed
        # on 26/10 and 27/10, the first days with upstream commits to push.
        run: gh workflow run docker.yaml --ref flyitalyadsb --repo "$GITHUB_REPOSITORY"
